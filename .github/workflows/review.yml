name: DeepSeek PR Review

on:
  # Retargeting a pull request is an "edited" event that changes the reviewed diff
  # without a new commit, so it is reviewed again; other edits start no review.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: read

concurrency:
  # A title or body edit gets its own group, so it never cancels a running review.
  group: deepseek-review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # pull_request_target checks out the base branch, so the action under review never runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          client-id: ${{ vars.REVIEW_CLIENT_ID }}
          app-private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          # This repository holds the approval rules, so a person approves changes to them too.
          approval-excluded-paths: .github/*, action.yml, scripts/*
          request-changes: "true"
